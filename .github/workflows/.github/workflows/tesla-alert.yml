name: Tesla Alert France

on:
  workflow_dispatch:

  schedule:
    - cron: "*/10 * * * *"

jobs:
  check-tesla:
    runs-on: ubuntu-latest

    steps:

      - name: Télécharger le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests

      - name: Vérifier les Tesla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python tesla_alert.py

      - name: Sauvegarder la base des Tesla vues
        run: |
          git config user.name "Tesla Alert Bot"
          git config user.email "tesla-alert@users.noreply.github.com"

          git add seen_teslas.json

          git diff --cached --quiet || git commit -m "Mise à jour Tesla détectées"

          git push