name: Tesla France Alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-tesla:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Chrome et Python
        run: |
          sudo apt-get update
          sudo apt-get install -y google-chrome-stable
          python -m pip install --upgrade pip
          pip install nodriver curl_cffi requests

      - name: Rechercher les Tesla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          cat > tesla_check.py <<'PY'
          import asyncio
          import json
          import os
          import time

          import nodriver as uc
          from curl_cffi import requests

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          API_URL = "https://www.tesla.com/inventory/api/v4/inventory-results"

          async def main():

              print("Ouverture de Tesla...")

              browser = await uc.start(
                  headless=True,
                  browser_executable_path="/usr/bin/google-chrome"
              )

              page = await browser.get(
                  "https://www.tesla.com/fr_fr/inventory/new/my"
              )

              await asyncio.sleep(10)

              cookies = await page.cookies.get_all()

              cookie_dict = {
                  cookie.name: cookie.value
                  for cookie in cookies
              }

              print(f"Cookies récupérés : {len(cookie_dict)}")

              browser.stop()

              query = {
                  "query": {
                      "condition": "new",
                      "model": ["m3", "my", "ms", "mx"],
                      "market": "FR",
                      "language": "fr"
                  },
                  "options": {
                      "sort": "Price",
                      "order": "asc",
                      "offset": 0,
                      "count": 100
                  }
              }

              params = {
                  "query": json.dumps(query, separators=(",", ":"))
              }

              print("Interrogation de l'inventaire Tesla...")

              response = requests.get(
                  API_URL,
                  params=params,
                  cookies=cookie_dict,
                  impersonate="chrome",
                  headers={
                      "Accept": "application/json",
                      "Referer": "https://www.tesla.com/fr_fr/",
                      "Origin": "https://www.tesla.com"
                  },
                  timeout=30
              )

              print("Tesla HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text[:1000])
                  raise Exception(
                      f"Tesla a répondu HTTP {response.status_code}"
                  )

              data = response.json()

              vehicles = data.get("results", [])

              if not isinstance(vehicles, list):
                  vehicles = []

              print(f"Tesla trouvées : {len(vehicles)}")

              database = "seen_teslas.json"

              try:
                  with open(database, "r") as f:
                      seen = set(json.load(f))
              except:
                  seen = set()

              new_vehicles = []

              for car in vehicles:

                  vin = car.get("VIN")

                  if not vin:
                      continue

                  if vin in seen:
                      continue

                  model = car.get("Model", "Tesla")
                  trim = car.get("TrimName", "")
                  price = car.get("Price", "?")
                  color = car.get("Color", "")
                  city = car.get("City", "")

                  url = (
                      car.get("VehicleURL")
                      or car.get("vehicleUrl")
                      or ""
                  )

                  new_vehicles.append({
                      "vin": vin,
                      "model": model,
                      "trim": trim,
                      "price": price,
                      "color": color,
                      "city": city,
                      "url": url
                  })

              print(
                  f"Nouvelles Tesla détectées : "
                  f"{len(new_vehicles)}"
              )

              # Envoi Telegram
              for car in new_vehicles[:10]:

                  message = (
                      "🚨 NOUVELLE TESLA DISPONIBLE 🇫🇷\n\n"
                      f"🚗 {car['model']}\n"
                      f"⚙️ {car['trim']}\n"
                      f"💰 {car['price']} €\n"
                      f"🎨 {car['color']}\n"
                      f"📍 {car['city']}\n"
                      f"🆔 {car['vin']}"
                  )

                  if car["url"]:
                      message += (
                          f"\n\n🔗 {car['url']}"
                      )

                  telegram_url = (
                      f"https://api.telegram.org/"
                      f"bot{BOT_TOKEN}/sendMessage"
                  )

                  telegram_response = requests.post(
                      telegram_url,
                      json={
                          "chat_id": CHAT_ID,
                          "text": message
                      },
                      timeout=20
                  )

                  print(
                      "Telegram HTTP:",
                      telegram_response.status_code
                  )

                  if telegram_response.status_code != 200:
                      print(
                          telegram_response.text
                      )
                      raise Exception(
                          "Erreur Telegram"
                      )

                  seen.add(car["vin"])

              with open(database, "w") as f:
                  json.dump(
                      sorted(seen),
                      f,
                      indent=2
                  )

          asyncio.run(main())
          PY

          python tesla_check.py

      - name: Sauvegarder les Tesla déjà vues
        run: |
          git config user.name "Tesla Alert Bot"
          git config user.email "tesla-alert@users.noreply.github.com"

          git add seen_teslas.json

          if git diff --cached --quiet; then
            echo "Aucune modification."
          else
            git commit -m "Update Tesla inventory"
            git push
          fi