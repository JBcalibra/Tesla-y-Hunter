name: Tesla France Alert

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  check-tesla:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Vérifier les Tesla disponibles
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          URL = "https://www.tesla.com/inventory/api/v4/inventory-results"

          params = {
              "market": "FR",
              "language": "fr",
              "model": "m3,my,ms,mx",
              "condition": "new",
              "arrangeby": "Price",
              "order": "asc",
              "offset": 0,
              "count": 100
          }

          headers = {
              "User-Agent": "Mozilla/5.0",
              "Accept": "application/json"
          }

          try:
              response = requests.get(
                  URL,
                  params=params,
                  headers=headers,
                  timeout=30
              )

              print("Tesla HTTP:", response.status_code)

              if response.status_code != 200:
                  raise Exception(
                      f"Réponse Tesla inattendue: {response.status_code}"
                  )

              data = response.json()

          except Exception as e:
              print("Erreur:", e)
              raise

          vehicles = data.get("results", [])

          print(f"Tesla trouvées : {len(vehicles)}")

          # Fichier qui mémorise les Tesla déjà signalées
          database = "seen_teslas.json"

          try:
              with open(database, "r") as f:
                  seen = set(json.load(f))
          except:
              seen = set()

          new_vehicles = []

          for car in vehicles:

              vin = (
                  car.get("VIN")
                  or car.get("vin")
                  or car.get("VINNumber")
              )

              if not vin:
                  continue

              if vin in seen:
                  continue

              model = (
                  car.get("Model")
                  or car.get("model")
                  or "Tesla"
              )

              price = (
                  car.get("Price")
                  or car.get("price")
                  or "?"
              )

              trim = (
                  car.get("TrimName")
                  or car.get("trimName")
                  or ""
              )

              color = (
                  car.get("Color")
                  or car.get("color")
                  or ""
              )

              city = (
                  car.get("City")
                  or car.get("city")
                  or ""
              )

              vehicle_url = (
                  car.get("VehicleURL")
                  or car.get("vehicleUrl")
                  or ""
              )

              new_vehicles.append({
                  "vin": vin,
                  "model": model,
                  "price": price,
                  "trim": trim,
                  "color": color,
                  "city": city,
                  "url": vehicle_url
              })

          # On mémorise toutes les Tesla détectées
          for car in vehicles:
              vin = (
                  car.get("VIN")
                  or car.get("vin")
                  or car.get("VINNumber")
              )

              if vin:
                  seen.add(vin)

          with open(database, "w") as f:
              json.dump(sorted(seen), f, indent=2)

          # Envoi Telegram uniquement pour les nouvelles Tesla
          for car in new_vehicles[:10]:

              message = (
                  "🚨 NOUVELLE TESLA DISPONIBLE 🇫🇷\n\n"
                  f"🚗 {car['model']}\n"
                  f"⚙️ {car['trim']}\n"
                  f"💰 {car['price']} €\n"
                  f"🎨 {car['color']}\n"
                  f"📍 {car['city']}\n"
                  f"🆔 {car['vin']}"
              )

              if car["url"]:
                  message += f"\n\n🔗 {car['url']}"

              telegram = (
                  f"https://api.telegram.org/"
                  f"bot{BOT_TOKEN}/sendMessage"
              )

              r = requests.post(
                  telegram,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram:", r.status_code)

          print(f"Nouvelles Tesla signalées : {len(new_vehicles)}")

          PY

      - name: Sauvegarder les Tesla déjà vues
        run: |
          git config user.name "Tesla Alert Bot"
          git config user.email "tesla-alert@users.noreply.github.com"

          git add seen_teslas.json

          git diff --cached --quiet || git commit -m "Update Tesla inventory"

          git push