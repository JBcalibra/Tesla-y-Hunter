name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          pip install requests

      - name: Rechercher l'inventaire Tesla France
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          import urllib.parse
          import hashlib

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          MODELS = ["m3", "my", "ms", "mx"]

          def telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              r = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram HTTP:", r.status_code)

              if r.status_code != 200:
                  print(r.text)
                  raise Exception("Erreur Telegram")

          def search_model(model):
              query = {
                  "query": {
                      "model": model,
                      "condition": "new",
                      "options": {},
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "zip": "",
                      "range": 0,
                      "region": "FR"
                  },
                  "offset": 0,
                  "count": 50,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "version": "v2"
              }

              params = {
                  "query": json.dumps(
                      query,
                      separators=(",", ":")
                  )
              }

              url = (
                  "https://www.tesla.com/"
                  "inventory/api/v4/inventory-results"
              )

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  ),
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "fr-FR,fr;q=0.9",
                  "Referer": (
                      f"https://www.tesla.com/"
                      f"fr_fr/inventory/new/{model}"
                  )
              }

              print(f"🔎 Recherche Model {model.upper()}...")

              response = requests.get(
                  url,
                  params=params,
                  headers=headers,
                  timeout=30
              )

              print(
                  f"Model {model.upper()} HTTP:",
                  response.status_code
              )

              if response.status_code != 200:
                  print(
                      "Réponse Tesla:",
                      response.text[:500]
                  )
                  return []

              try:
                  data = response.json()
              except Exception:
                  print("❌ Réponse Tesla non JSON")
                  return []

              if isinstance(data, dict):
                  results = data.get("results", [])

                  if not results:
                      results = data.get(
                          "response",
                          []
                      )

                  if isinstance(results, dict):
                      results = results.get(
                          "results",
                          []
                      )

                  if isinstance(results, list):
                      return results

              return []

          print("🚗 TESLA HUNTER")
          print("========================")

          all_cars = []

          for model in MODELS:
              try:
                  cars = search_model(model)
                  print(
                      f"➡️ {model.upper()} : "
                      f"{len(cars)} véhicule(s)"
                  )
                  all_cars.extend(cars)
              except Exception as e:
                  print(
                      f"⚠️ Erreur Model {model.upper()} : {e}"
                  )

          print("========================")
          print(
              f"🚘 TOTAL : {len(all_cars)} véhicule(s)"
          )

          if not all_cars:
              telegram(
                  "🤖 TESLA HUNTER ACTIF 🇫🇷\n\n"
                  "✅ GitHub Actions fonctionne\n"
                  "✅ Telegram fonctionne\n"
                  "🔎 Recherche inventaire Tesla France\n\n"
                  "ℹ️ Aucun véhicule récupéré pour "
                  "le moment.\n\n"
                  "Le robot continue sa surveillance."
              )
              raise SystemExit(0)

          messages = []

          for car in all_cars:
              try:
                  model = str(
                      car.get("Model", car.get("model", "Tesla"))
                  )

                  price = car.get(
                      "Price",
                      car.get("price", "?")
                  )

                  vin = car.get(
                      "VIN",
                      car.get("vin", "")
                  )

                  city = car.get(
                      "City",
                      car.get("city", "")
                  )

                  exterior = car.get(
                      "Paint",
                      car.get("paint", "")
                  )

                  interior = car.get(
                      "Interior",
                      car.get("interior", "")
                  )

                  trim = car.get(
                      "Trim",
                      car.get("trim", "")
                  )

                  vehicle_url = (
                      car.get("vehicleUrl")
                      or car.get("VehicleURL")
                      or car.get("url")
                      or ""
                  )

                  if not vehicle_url and vin:
                      vehicle_url = (
                          "https://www.tesla.com/"
                          "fr_fr/inventory/new/"
                          f"{model.lower()}"
                      )

                  text = (
                      "🚨 TESLA DISPONIBLE 🇫🇷\n\n"
                      f"🚘 Modèle : {model}\n"
                      f"💰 Prix : {price} €\n"
                      f"🎨 Extérieur : {exterior}\n"
                      f"🛋️ Intérieur : {interior}\n"
                      f"⚙️ Version : {trim}\n"
                      f"📍 Livraison : {city}\n"
                  )

                  if vin:
                      text += f"🔑 VIN : {vin}\n"

                  if vehicle_url:
                      text += f"\n🔗 {vehicle_url}"

                  messages.append(text)

              except Exception as e:
                  print(
                      "⚠️ Impossible de lire un véhicule:",
                      e
                  )

          if messages:
              for message in messages[:20]:
                  telegram(message)

          print("📨 Surveillance terminée.")
          PY