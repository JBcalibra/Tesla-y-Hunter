name: Tesla Hunter France

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  check-tesla:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests nodriver curl_cffi

      - name: Rechercher les Tesla neuves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import requests
          import nodriver as uc

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          MODELS = {
              "m3": "Model 3",
              "my": "Model Y",
              "ms": "Model S",
              "mx": "Model X",
          }

          TESLA_URL = "https://www.tesla.com/fr_fr/inventory/new"

          async def get_page():
              print("🌐 Démarrage de Chrome...")

              browser = await uc.start(
                  headless=True,
                  sandbox=False,
                  browser_args=[
                      "--no-sandbox",
                      "--disable-dev-shm-usage",
                      "--disable-gpu",
                      "--disable-software-rasterizer",
                      "--disable-extensions",
                      "--no-first-run",
                      "--no-default-browser-check",
                      "--window-size=1920,1080",
                  ],
              )

              print("🚗 Ouverture de Tesla France...")

              page = await browser.get(TESLA_URL)

              print("⏳ Attente du chargement Tesla...")
              await asyncio.sleep(10)

              return browser, page

          async def get_inventory(page, model_code):
              url = (
                  f"https://www.tesla.com/fr_fr/inventory/new/"
                  f"{model_code}"
              )

              print(f"🔎 Ouverture {MODELS[model_code]}...")

              try:
                  await page.get(url)
                  await asyncio.sleep(5)

                  html = await page.get_content()

                  print(
                      f"   📄 Page reçue : {len(html)} caractères"
                  )

                  return html

              except Exception as e:
                  print(
                      f"❌ Erreur {MODELS[model_code]} : {e}"
                  )
                  return ""

          def send_telegram(message):
              url = (
                  f"https://api.telegram.org/bot"
                  f"{BOT_TOKEN}/sendMessage"
              )

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message,
                  },
                  timeout=20,
              )

              print(
                  "📨 Telegram HTTP:",
                  response.status_code,
              )

              if response.status_code != 200:
                  print(response.text)
                  raise Exception("Erreur Telegram")

          async def main():
              print("")
              print("🤖 TESLA HUNTER FRANCE")
              print("=" * 40)

              browser, page = await get_page()

              found = []

              try:
                  for model_code in MODELS:
                      html = await get_inventory(
                          page,
                          model_code,
                      )

                      if html:
                          # On garde la page pour analyse.
                          # Cette méthode évite la récupération
                          # de cookies Tesla.
                          found.append({
                              "model": MODELS[model_code],
                              "url": (
                                  f"https://www.tesla.com/"
                                  f"fr_fr/inventory/new/"
                                  f"{model_code}"
                              ),
                          })

              finally:
                  try:
                      browser.stop()
                  except Exception:
                      pass

              print("")
              print(
                  f"🚗 Pages Tesla analysées : {len(found)}"
              )

              # Pour le moment, on envoie uniquement un message
              # de test afin de vérifier que Chrome + Tesla +
              # Telegram fonctionnent.
              if found:
                  message = (
                      "🤖 TESLA HUNTER FRANCE\n\n"
                      "✅ Connexion Tesla réussie.\n\n"
                      "Modèles surveillés :\n"
                      "🚗 Model 3\n"
                      "🚙 Model Y\n"
                      "🚘 Model S\n"
                      "🚘 Model X\n\n"
                      "🇫🇷 Recherche : véhicules neufs"
                  )

                  send_telegram(message)
                  print("✅ Message Telegram envoyé !")

          asyncio.run(main())
          PY