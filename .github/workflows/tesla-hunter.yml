name: Tesla Hunter France

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  search:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install curl_cffi nodriver

      - name: Recherche Tesla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import time
          from urllib.parse import quote

          from curl_cffi import requests
          import nodriver as uc


          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          API_URL = "https://www.tesla.com/inventory/api/v4/inventory-results"

          MODELS = {
              "m3": "Model 3",
              "my": "Model Y",
              "ms": "Model S",
              "mx": "Model X",
          }


          async def get_tesla_cookies():

              print("🌐 Ouverture de Tesla avec Chrome...")

              browser = await uc.start(
                  headless=True,
                  browser_executable_path="/usr/bin/google-chrome"
              )

              page = await browser.get(
                  "https://www.tesla.com/fr_fr/inventory/new"
              )

              print("⏳ Attente de la validation Tesla/Akamai...")
              await asyncio.sleep(15)

              cookies = await page.send(
                  uc.cdp.network.get_cookies()
              )

              cookie_dict = {}

              for cookie in cookies.cookies:
                  cookie_dict[cookie.name] = cookie.value

              print(f"🍪 Cookies récupérés : {len(cookie_dict)}")

              await browser.stop()

              return cookie_dict


          def search_inventory(model_code, cookies):

              query = {
                  "query": {
                      "model": model_code,
                      "condition": "new",
                      "options": {},
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "lng": 2.3522,
                      "lat": 48.8566,
                      "zip": "75001",
                      "range": 0
                  },
                  "offset": 0,
                  "count": 100,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "isFalconDeliverySelectionEnabled": True,
                  "version": "v2"
              }

              encoded_query = quote(
                  json.dumps(query, separators=(",", ":"))
              )

              url = f"{API_URL}?query={encoded_query}"

              print(f"🔎 Recherche {MODELS[model_code]}...")

              r = requests.get(
                  url,
                  impersonate="chrome",
                  cookies=cookies,
                  headers={
                      "accept": "*/*",
                      "accept-language": "fr-FR,fr;q=0.9,en;q=0.8",
                      "referer": "https://www.tesla.com/fr_fr/inventory/new",
                      "user-agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) "
                          "AppleWebKit/537.36 (KHTML, like Gecko) "
                          "Chrome/139.0.0.0 Safari/537.36"
                      ),
                  },
                  timeout=30,
              )

              print(f"   HTTP {r.status_code}")

              if r.status_code != 200:
                  print("⚠️ Tesla refuse encore la requête")
                  print(r.text[:500])
                  return None

              try:
                  data = r.json()
              except Exception:
                  print("❌ Réponse Tesla non JSON")
                  print(r.text[:500])
                  return None

              results = data.get("results", [])

              if not isinstance(results, list):
                  results = []

              print(f"   ✅ {len(results)} véhicule(s)")

              return results


          def send_telegram(message):

              url = (
                  f"https://api.telegram.org/"
                  f"bot{BOT_TOKEN}/sendMessage"
              )

              r = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message,
                      "disable_web_page_preview": False,
                  },
                  impersonate="chrome",
                  timeout=20,
              )

              print("📨 Telegram HTTP:", r.status_code)

              if r.status_code != 200:
                  print(r.text)
                  raise Exception("Erreur Telegram")


          async def main():

              print("")
              print("🤖 TESLA HUNTER FRANCE")
              print("=" * 50)

              cookies = await get_tesla_cookies()

              if not cookies:
                  print("❌ Impossible de récupérer les cookies Tesla")

                  send_telegram(
                      "⚠️ TESLA HUNTER 🇫🇷\n\n"
                      "❌ Impossible d'obtenir les cookies Tesla/Akamai.\n\n"
                      "La recherche n'a PAS été considérée comme vide."
                  )

                  return

              found = []
              blocked = False

              for model_code in MODELS:

                  results = search_inventory(
                      model_code,
                      cookies
                  )

                  # Très important :
                  # None = problème d'accès Tesla
                  # []   = Tesla répond correctement mais aucun véhicule
                  if results is None:
                      blocked = True
                      continue

                  for car in results:

                      condition = str(
                          car.get("Condition", "")
                      ).lower()

                      if condition not in ("", "new"):
                          continue

                      found.append({
                          "model": MODELS[model_code],
                          "vin": car.get("VIN", ""),
                          "price": car.get("InventoryPrice"),
                          "trim": car.get(
                              "TrimName",
                              "Version inconnue"
                          ),
                          "year": car.get("Year", ""),
                          "paint": car.get(
                              "Paint",
                              car.get("PAINT", "")
                          ),
                          "interior": car.get(
                              "Interior",
                              ""
                          ),
                          "location": car.get(
                              "DeliveryLocation",
                              car.get("City", "")
                          ),
                      })

              print("")
              print("=" * 50)
              print(f"🚗 TOTAL : {len(found)} Tesla neuve(s)")
              print("=" * 50)

              # Tesla inaccessible
              if blocked:

                  send_telegram(
                      "⚠️ TESLA HUNTER 🇫🇷\n\n"
                      "🚫 Tesla a bloqué au moins une requête "
                      "d'inventaire (HTTP 403).\n\n"
                      "La recherche est considérée comme "
                      "INCOMPLÈTE.\n\n"
                      "👉 Aucune alerte de disponibilité "
                      "n'est envoyée."
                  )

                  return

              # Aucun véhicule
              if not found:

                  print("ℹ️ Aucune Tesla neuve détectée.")

                  send_telegram(
                      "🔎 TESLA HUNTER 🇫🇷\n\n"
                      "Aucune Tesla neuve disponible "
                      "détectée actuellement.\n\n"
                      "Modèles surveillés :\n"
                      "• Model 3\n"
                      "• Model Y\n"
                      "• Model S\n"
                      "• Model X"
                  )

                  return

              # Véhicules trouvés
              message = (
                  "🚨 TESLA DISPONIBLE ! 🇫🇷\n\n"
                  f"🚗 {len(found)} Tesla neuve(s) détectée(s)\n\n"
              )

              for car in found[:15]:

                  price = car["price"]

                  if isinstance(price, (int, float)):
                      price_text = (
                          f"{price:,.0f} €"
                          .replace(",", " ")
                      )
                  else:
                      price_text = "Prix indisponible"

                  message += (
                      f"⚡ {car['model']}\n"
                      f"💰 {price_text}\n"
                      f"🏷️ {car['trim']}\n"
                  )

                  if car["year"]:
                      message += f"📅 {car['year']}\n"

                  if car["paint"]:
                      message += f"🎨 {car['paint']}\n"

                  if car["interior"]:
                      message += f"🛋️ {car['interior']}\n"

                  if car["location"]:
                      message += f"📍 {car['location']}\n"

                  if car["vin"]:
                      message += f"🔑 VIN : {car['vin']}\n"

                  message += "\n"

              send_telegram(message)

              print("✅ Alerte Telegram envoyée !")


          asyncio.run(main())

          PY