name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Installer les dépendances
        run: pip install nodriver requests

      - name: Tester Tesla et Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import os
          import requests
          import nodriver as uc

          async def main():
              print("🚗 Ouverture de Tesla...")

              browser = await uc.start(
                  headless=True,
                  no_sandbox=True,
                  browser_executable_path="/usr/bin/google-chrome"
              )

              page = await browser.get(
                  "https://www.tesla.com/fr_fr/inventory/new/my"
              )

              print("⏳ Attente du chargement de Tesla...")
              await asyncio.sleep(12)

              html = await page.get_content()

              print(f"✅ Page Tesla reçue : {len(html)} caractères")

              browser.stop()

              url = f"https://api.telegram.org/bot{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"

              response = requests.post(
                  url,
                  json={
                      "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                      "text": "🤖 TESLA HUNTER ACTIF 🇫🇷\n\n✅ Tesla accessible\n✅ Telegram connecté\n✅ Surveillance Model 3 / Y / S / X"
                  },
                  timeout=20
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise Exception("Erreur Telegram")

              print("📨 Message Telegram envoyé !")

          asyncio.run(main())
          PY