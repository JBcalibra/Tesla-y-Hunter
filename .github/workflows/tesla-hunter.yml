name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: |
          pip install requests

      - name: Tesla Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'
          import json
          import os
          import requests

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          MODELS = {
              "m3": "Model 3",
              "my": "Model Y",
              "ms": "Model S",
              "mx": "Model X"
          }

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise Exception("Erreur Telegram")

          def search_tesla(model_code, model_name):

              print(f"🔎 Recherche {model_name}...")

              url = "https://www.tesla.com/inventory/api/v4/inventory-results"

              query = {
                  "query": {
                      "model": model_code,
                      "condition": "new",
                      "options": {},
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "zip": "",
                      "range": 0,
                      "region": "FR"
                  },
                  "offset": 0,
                  "count": 50,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "version": "v2"
              }

              headers = {
                  "User-Agent": (
                      "Mozilla/5.0 (Windows NT 10.0; Win64; x64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  ),
                  "Accept": "application/json, text/plain, */*",
                  "Accept-Language": "fr-FR,fr;q=0.9",
                  "Referer": (
                      f"https://www.tesla.com/"
                      f"fr_fr/inventory/new/{model_code}"
                  )
              }

              try:
                  response = requests.get(
                      url,
                      params={
                          "query": json.dumps(
                              query,
                              separators=(",", ":")
                          )
                      },
                      headers=headers,
                      timeout=30
                  )

                  print(
                      f"{model_name} HTTP:",
                      response.status_code
                  )

                  if response.status_code != 200:
                      print(
                          f"⚠️ Tesla bloque {model_name}: "
                          f"HTTP {response.status_code}"
                      )
                      return []

                  data = response.json()

                  results = data.get("results", [])

                  if isinstance(results, dict):
                      results = results.get("results", [])

                  if not isinstance(results, list):
                      results = []

                  print(
                      f"➡️ {model_name}: "
                      f"{len(results)} véhicule(s)"
                  )

                  return results

              except Exception as error:
                  print(
                      f"⚠️ Erreur {model_name}: {error}"
                  )
                  return []

          print("")
          print("🚗 TESLA HUNTER")
          print("========================")

          all_cars = []

          for code, name in MODELS.items():
              cars = search_tesla(code, name)

              for car in cars:
                  car["_hunter_model"] = name

              all_cars.extend(cars)

          print("========================")
          print(
              f"🚘 TOTAL : {len(all_cars)} véhicule(s)"
          )

          if len(all_cars) == 0:

              message = (
                  "🤖 TESLA HUNTER ACTIF 🇫🇷\n\n"
                  "✅ GitHub Actions fonctionne\n"
                  "✅ Telegram fonctionne\n"
                  "🔎 Recherche Model 3 / Y / S / X\n\n"
                  "⚠️ Aucun véhicule récupéré "
                  "lors de cette vérification.\n\n"
                  "Le Hunter continue la surveillance."
              )

              send_telegram(message)

          else:

              message = (
                  "🚨 TESLA(S) TROUVÉE(S) 🇫🇷\n\n"
                  f"🚘 {len(all_cars)} véhicule(s) détecté(s)\n\n"
              )

              for car in all_cars[:10]:

                  model = car.get(
                      "_hunter_model",
                      "Tesla"
                  )

                  price = (
                      car.get("Price")
                      or car.get("price")
                      or "Prix non disponible"
                  )

                  vin = (
                      car.get("VIN")
                      or car.get("vin")
                      or ""
                  )

                  city = (
                      car.get("City")
                      or car.get("city")
                      or ""
                  )

                  message += (
                      f"🚗 {model}\n"
                      f"💰 {price} €\n"
                  )

                  if city:
                      message += f"📍 {city}\n"

                  if vin:
                      message += f"🔑 VIN : {vin}\n"

                  message += "\n"

              send_telegram(message)

          print("📨 Surveillance terminée.")
          PY