name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Installer les dépendances
        run: |
          pip install nodriver curl_cffi requests

      - name: Tesla Hunter
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import asyncio
          import json
          import os
          import shutil
          import urllib.parse

          import nodriver as uc
          from curl_cffi import requests


          TELEGRAM_BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          TELEGRAM_CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          TESLA_URL = "https://www.tesla.com/fr_fr/inventory/new/my"
          API_URL = "https://www.tesla.com/inventory/api/v4/inventory-results"


          async def get_tesla_cookies():
              print("🚗 Démarrage de Chrome...")

              chrome_path = shutil.which("google-chrome")

              print("Chrome trouvé :", chrome_path)

              if not chrome_path:
                  raise Exception("Chrome introuvable")

              browser = await uc.start(
                  headless=True,
                  no_sandbox=True,
                  browser_executable_path=chrome_path
              )

              try:
                  print("🌐 Ouverture de Tesla...")
                  page = await browser.get(TESLA_URL)

                  print("⏳ Attente de Tesla/Akamai...")
                  await asyncio.sleep(15)

                  print("🍪 Récupération des cookies...")

                  cookies = await browser.cookies.get_all()

                  cookie_dict = {}

                  for cookie in cookies:
                      cookie_dict[cookie.name] = cookie.value

                  print("Nombre de cookies :", len(cookie_dict))

                  if not cookie_dict:
                      raise Exception("Aucun cookie Tesla récupéré")

                  return cookie_dict

              finally:
                  try:
                      browser.stop()
                  except Exception:
                      pass


          def search_tesla(cookies, model):

              query = {
                  "query": {
                      "model": model,
                      "condition": "new",
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "PaymentType": "cash",
                      "lng": 0.5792,
                      "lat": 45.8992,
                      "zip": "17000",
                      "range": 0,
                      "region": "FR"
                  },
                  "offset": 0,
                  "count": 50,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "isFalconDeliverySelectionEnabled": False,
                  "version": None
              }

              encoded = urllib.parse.quote(
                  json.dumps(query, separators=(",", ":"))
              )

              url = f"{API_URL}?query={encoded}"

              session = requests.Session(
                  impersonate="chrome"
              )

              response = session.get(
                  url,
                  cookies=cookies,
                  headers={
                      "accept": "application/json, text/plain, */*",
                      "accept-language": "fr-FR,fr;q=0.9",
                      "referer": TESLA_URL,
                      "user-agent": (
                          "Mozilla/5.0 (X11; Linux x86_64) "
                          "AppleWebKit/537.36 "
                          "(KHTML, like Gecko) "
                          "Chrome/139.0.0.0 Safari/537.36"
                      )
                  },
                  timeout=30
              )

              print(f"Model {model} → HTTP {response.status_code}")

              if response.status_code != 200:
                  print(response.text[:500])
                  return []

              data = response.json()

              results = data.get("results", [])

              if not isinstance(results, list):
                  return []

              return results


          def send_telegram(message):

              url = (
                  f"https://api.telegram.org/bot"
                  f"{TELEGRAM_BOT_TOKEN}/sendMessage"
              )

              response = requests.post(
                  url,
                  json={
                      "chat_id": TELEGRAM_CHAT_ID,
                      "text": message
                  },
                  timeout=20
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise Exception("Erreur Telegram")

              print("📨 Telegram envoyé !")


          async def main():

              cookies = await get_tesla_cookies()

              print("🔎 Recherche Model 3...")
              model3 = search_tesla(cookies, "m3")

              print("🔎 Recherche Model Y...")
              modely = search_tesla(cookies, "my")

              print("🔎 Recherche Model S...")
              models = search_tesla(cookies, "ms")

              print("🔎 Recherche Model X...")
              modelx = search_tesla(cookies, "mx")

              all_cars = (
                  model3 +
                  modely +
                  models +
                  modelx
              )

              print("")
              print("🚗 TOTAL VÉHICULES TROUVÉS :", len(all_cars))
              print("")

              if not all_cars:
                  print("ℹ️ Aucun véhicule neuf trouvé.")
                  return

              message = "🚨 TESLA HUNTER 🇫🇷\n\n"

              for car in all_cars[:10]:

                  vin = car.get("VIN", "VIN inconnu")
                  model = car.get("Model", "Tesla")
                  trim = car.get("TrimName", "Version inconnue")
                  year = car.get("Year", "")
                  price = car.get("TotalPrice", "Prix inconnu")
                  mileage = car.get("Odometer", 0)

                  message += (
                      f"🚗 {model} {trim}\n"
                      f"💰 {price} €\n"
                      f"📅 {year}\n"
                      f"🛣️ {mileage} km\n"
                      f"🔑 VIN : {vin}\n\n"
                  )

              send_telegram(message)


          asyncio.run(main())
          PY