name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer requests
        run: pip install requests

      - name: Rechercher les Tesla neuves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import json
          import requests
          from urllib.parse import quote

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          MODELS = {
              "m3": "Model 3",
              "my": "Model Y",
              "ms": "Model S",
              "mx": "Model X"
          }

          print("🚗 TESLA HUNTER")
          print("🇫🇷 Recherche Tesla neuves en France")

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (iPhone; CPU iPhone OS 16_6 like Mac OS X) "
                  "AppleWebKit/605.1.15 Version/16.6 Mobile/15E148 Safari/604.1"
              ),
              "Accept": "application/json",
              "Accept-Language": "fr-FR,fr;q=0.9",
              "Referer": "https://www.tesla.com/fr_fr/inventory/new/"
          }

          found = []

          for model_code, model_name in MODELS.items():

              query = {
                  "query": {
                      "model": model_code,
                      "condition": "new",
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "lng": 2.3522,
                      "lat": 48.8566,
                      "zip": "75001",
                      "range": 0
                  },
                  "offset": 0,
                  "count": 100,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "isFalconDeliverySelectionEnabled": False,
                  "version": "v2"
              }

              encoded = quote(json.dumps(query, separators=(",", ":")))

              url = (
                  "https://www.tesla.com/inventory/api/v4/"
                  f"inventory-results?query={encoded}"
              )

              print(f"🔎 {model_name}...")

              try:
                  response = requests.get(
                      url,
                      headers=headers,
                      timeout=30
                  )

                  print(f"   HTTP {response.status_code}")

                  if response.status_code != 200:
                      print(f"   ⚠️ Tesla a répondu {response.status_code}")
                      continue

                  data = response.json()
                  results = data.get("results", [])

                  if not isinstance(results, list):
                      results = []

                  print(f"   {len(results)} véhicule(s) trouvé(s)")

                  for car in results:

                      # Sécurité : on garde uniquement le neuf
                      if str(car.get("Condition", "")).lower() not in ("", "new"):
                          continue

                      vin = car.get("VIN", "")
                      price = car.get("InventoryPrice")
                      trim = car.get("TrimName", "Version inconnue")
                      year = car.get("Year", "")
                      exterior = car.get("Paint", "")
                      interior = car.get("Interior", "")

                      order_url = ""

                      if vin:
                          order_url = (
                              f"https://www.tesla.com/fr_fr/my/order/"
                              f"{vin}"
                          )

                      found.append({
                          "model": model_name,
                          "vin": vin,
                          "price": price,
                          "trim": trim,
                          "year": year,
                          "exterior": exterior,
                          "interior": interior,
                          "url": order_url
                      })

              except Exception as e:
                  print(f"   ❌ Erreur : {e}")

          print()
          print(f"🚗 TOTAL : {len(found)} Tesla trouvée(s)")

          # --------------------------------------------------
          # TELEGRAM
          # --------------------------------------------------

          if not found:
              print("ℹ️ Aucun véhicule trouvé.")
              print("ℹ️ Aucune notification Telegram envoyée.")
              raise SystemExit(0)

          message = (
              "🚨 TESLA DISPONIBLE ! 🇫🇷\n\n"
              f"🚗 {len(found)} véhicule(s) neuf(s) détecté(s)\n\n"
          )

          # Maximum 10 véhicules dans une notification
          for car in found[:10]:

              price = car["price"]

              if isinstance(price, (int, float)):
                  price_text = f"{price:,.0f} €".replace(",", " ")
              else:
                  price_text = "Prix indisponible"

              message += (
                  f"⚡ {car['model']}\n"
                  f"💰 {price_text}\n"
                  f"🏷️ {car['trim']}\n"
                  f"📅 {car['year']}\n"
              )

              if car["exterior"]:
                  message += f"🎨 {car['exterior']}\n"

              if car["interior"]:
                  message += f"🛋️ {car['interior']}\n"

              if car["url"]:
                  message += f"🔗 {car['url']}\n"

              message += "\n"

          telegram_url = (
              f"https://api.telegram.org/bot"
              f"{BOT_TOKEN}/sendMessage"
          )

          telegram = requests.post(
              telegram_url,
              json={
                  "chat_id": CHAT_ID,
                  "text": message
              },
              timeout=20
          )

          print("Telegram HTTP:", telegram.status_code)

          if telegram.status_code != 200:
              print(telegram.text)
              raise Exception("Erreur Telegram")

          print("📨 Alerte Telegram envoyée !")
          PY