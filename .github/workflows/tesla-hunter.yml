name: Tesla Hunter France

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tesla-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests beautifulsoup4

      - name: Rechercher les Tesla neuves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import re
          import json
          import hashlib
          import subprocess
          from urllib.parse import urljoin

          import requests
          from bs4 import BeautifulSoup


          # ============================================================
          # CONFIGURATION
          # ============================================================

          SOURCE_URL = "https://tesla-info.com/inventory/France/All/New/"

          MODELS = {
              "Model 3",
              "Model Y",
              "Model S",
              "Model X",
          }

          STATE_FILE = "tesla_seen.json"

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(text):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": text,
                      "disable_web_page_preview": False,
                  },
                  timeout=20,
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise RuntimeError("Erreur Telegram")


          # ============================================================
          # ETAT DES VEHICULES DEJA VUS
          # ============================================================

          def load_seen():
              if not os.path.exists(STATE_FILE):
                  return set()

              try:
                  with open(STATE_FILE, "r", encoding="utf-8") as f:
                      data = json.load(f)

                  return set(data)

              except Exception:
                  return set()


          def save_seen(seen):
              with open(STATE_FILE, "w", encoding="utf-8") as f:
                  json.dump(
                      sorted(seen),
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          # ============================================================
          # RECUPERATION TESLA-INFO
          # ============================================================

          headers = {
              "User-Agent": (
                  "Mozilla/5.0 (X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/139.0.0.0 Safari/537.36"
              ),
              "Accept": (
                  "text/html,application/xhtml+xml,"
                  "application/xml;q=0.9,image/avif,image/webp,*/*;q=0.8"
              ),
              "Accept-Language": "fr-FR,fr;q=0.9,en;q=0.8",
              "Referer": "https://tesla-info.com/",
          }


          print("=" * 60)
          print("TESLA HUNTER FRANCE")
          print("=" * 60)
          print()
          print("Source :", SOURCE_URL)
          print("Modèles :", ", ".join(sorted(MODELS)))
          print()


          try:
              response = requests.get(
                  SOURCE_URL,
                  headers=headers,
                  timeout=30,
              )

          except Exception as e:
              print("❌ Impossible de contacter Tesla-info")
              print(e)
              raise SystemExit(1)


          print("Tesla-info HTTP :", response.status_code)

          if response.status_code != 200:
              print(response.text[:1000])
              raise SystemExit(1)


          html = response.text

          print("Taille HTML :", len(html), "octets")


          # ============================================================
          # PARSING
          # ============================================================

          soup = BeautifulSoup(html, "html.parser")

          vehicles = []


          # On recherche les liens de véhicules.
          # Tesla-info peut modifier légèrement sa structure :
          # on utilise donc plusieurs méthodes de détection.

          for link in soup.find_all("a", href=True):

              href = link.get("href", "").strip()

              text = " ".join(
                  link.stripped_strings
              ).strip()

              if not text:
                  continue

              absolute_url = urljoin(
                  SOURCE_URL,
                  href,
              )

              lower_text = text.lower()

              # --------------------------------------------------------
              # Détection du modèle
              # --------------------------------------------------------

              model = None

              for candidate in MODELS:
                  if candidate.lower() in lower_text:
                      model = candidate
                      break

              if model is None:
                  continue


              # --------------------------------------------------------
              # On évite les liens de navigation
              # --------------------------------------------------------

              if "/inventory/" not in absolute_url.lower():
                  continue


              # --------------------------------------------------------
              # Recherche du prix
              # --------------------------------------------------------

              price_match = re.search(
                  r"(\d[\d\s.,]{2,})\s*€",
                  text
              )

              price = ""

              if price_match:
                  price = price_match.group(1).strip() + " €"


              # --------------------------------------------------------
              # Identification unique
              # --------------------------------------------------------

              unique_source = (
                  absolute_url
                  + "|"
                  + text
              )

              vehicle_id = hashlib.sha256(
                  unique_source.encode("utf-8")
              ).hexdigest()


              vehicles.append({
                  "id": vehicle_id,
                  "model": model,
                  "text": text,
                  "url": absolute_url,
                  "price": price,
              })


          # ============================================================
          # SUPPRESSION DES DOUBLONS
          # ============================================================

          unique = {}

          for vehicle in vehicles:
              unique[vehicle["id"]] = vehicle

          vehicles = list(unique.values())


          print()
          print("Véhicules détectés :", len(vehicles))
          print()


          # ============================================================
          # ETAT
          # ============================================================

          seen = load_seen()

          print("Véhicules déjà vus :", len(seen))


          new_vehicles = [
              vehicle
              for vehicle in vehicles
              if vehicle["id"] not in seen
          ]


          # ============================================================
          # PREMIERE EXECUTION
          # ============================================================
          #
          # Important :
          # lors du premier lancement, on mémorise les voitures
          # existantes sans envoyer 50 alertes Telegram.
          #

          if not seen:

              print()
              print("ℹ️ Première exécution.")
              print("Les véhicules actuels sont mémorisés.")
              print("Aucune alerte massive ne sera envoyée.")

              for vehicle in vehicles:
                  seen.add(vehicle["id"])

              save_seen(seen)

          else:

              print()
              print("🆕 Nouveaux véhicules :", len(new_vehicles))


              # ========================================================
              # ALERTES
              # ========================================================

              for vehicle in new_vehicles:

                  message = (
                      "🚨 TESLA DISPONIBLE 🇫🇷\n\n"
                      f"🚗 {vehicle['model']}\n"
                  )

                  if vehicle["price"]:
                      message += (
                          f"💰 {vehicle['price']}\n"
                      )

                  message += (
                      f"\n📋 {vehicle['text']}\n\n"
                      f"🔗 {vehicle['url']}"
                  )


                  print()
                  print("-" * 60)
                  print(message)
                  print("-" * 60)


                  send_telegram(message)

                  seen.add(vehicle["id"])


              save_seen(seen)


          # ============================================================
          # SAUVEGARDE DANS GITHUB
          # ============================================================

          subprocess.run(
              ["git", "config", "user.name", "Tesla Hunter"],
              check=True,
          )

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "tesla-hunter@users.noreply.github.com",
              ],
              check=True,
          )


          subprocess.run(
              ["git", "add", STATE_FILE],
              check=True,
          )


          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet",
              ]
          )


          if result.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Tesla Hunter state",
                  ],
                  check=True,
              )

              subprocess.run(
                  ["git", "push"],
                  check=True,
              )

              print()
              print("✅ Etat sauvegardé dans GitHub.")

          else:

              print()
              print("ℹ️ Aucun changement à sauvegarder.")


          print()
          print("=" * 60)
          print("✅ TESLA HUNTER TERMINÉ")
          print("=" * 60)

          PY