name: Tesla Hunter

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-check:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer Chrome
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Installer les dépendances
        run: |
          pip install requests

      - name: Tester Tesla et Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import os
          import requests

          print("🚗 Test de connexion Tesla...")

          url = "https://www.tesla.com/fr_fr/inventory/new/my"

          response = requests.get(
              url,
              headers={
                  "User-Agent": "Mozilla/5.0 (Windows NT 10.0; Win64; x64) AppleWebKit/537.36 Chrome/139 Safari/537.36",
                  "Accept-Language": "fr-FR,fr;q=0.9"
              },
              timeout=30
          )

          print("Tesla HTTP:", response.status_code)
          print("Taille de la page:", len(response.text))

          if response.status_code not in [200, 403]:
              raise Exception("Tesla ne répond pas correctement")

          print("✅ Tesla répond")

          telegram_url = (
              f"https://api.telegram.org/bot"
              f"{os.environ['TELEGRAM_BOT_TOKEN']}/sendMessage"
          )

          message = (
              "🤖 TESLA HUNTER ACTIF 🇫🇷\n\n"
              "✅ GitHub Actions fonctionne\n"
              "✅ Tesla répond\n"
              "✅ Telegram connecté\n"
              "🔎 Surveillance prévue : Model 3 / Y / S / X\n"
          )

          telegram = requests.post(
              telegram_url,
              json={
                  "chat_id": os.environ["TELEGRAM_CHAT_ID"],
                  "text": message
              },
              timeout=20
          )

          print("Telegram HTTP:", telegram.status_code)

          if telegram.status_code != 200:
              print(telegram.text)
              raise Exception("Erreur Telegram")

          print("📨 Message Telegram envoyé !")
          PY