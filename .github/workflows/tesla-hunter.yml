name: Tesla Hunter France

on:
  workflow_dispatch:
  schedule:
    - cron: "*/10 * * * *"

jobs:
  tesla-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests curl_cffi

      - name: Recherche Tesla
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          python - <<'PY'
          import json
          import os
          import requests
          from curl_cffi import requests as curl_requests

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]

          MODELS = {
              "m3": "Model 3",
              "my": "Model Y",
              "ms": "Model S",
              "mx": "Model X",
          }

          API_URL = "https://www.tesla.com/inventory/api/v4/inventory-results"

          def send_telegram(message):
              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": message,
                  },
                  timeout=20,
              )

              print("📨 Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise Exception("Erreur Telegram")

          def search_inventory(model_code):

              query = {
                  "query": {
                      "model": model_code,
                      "condition": "new",
                      "arrangeby": "Price",
                      "order": "asc",
                      "market": "FR",
                      "language": "fr",
                      "super_region": "europe",
                      "lng": 2.3522,
                      "lat": 48.8566,
                      "zip": "75001",
                      "range": 0,
                  },
                  "offset": 0,
                  "count": 100,
                  "outsideOffset": 0,
                  "outsideSearch": False,
                  "isFalconDeliverySelectionEnabled": False,
                  "version": "v2",
              }

              headers = {
                  "accept": "application/json",
                  "accept-language": "fr-FR,fr;q=0.9",
                  "referer": "https://www.tesla.com/fr_fr/inventory/new",
                  "user-agent": (
                      "Mozilla/5.0 (X11; Linux x86_64) "
                      "AppleWebKit/537.36 "
                      "(KHTML, like Gecko) "
                      "Chrome/139.0.0.0 Safari/537.36"
                  ),
                  "origin": "https://www.tesla.com",
              }

              print(f"🔎 Recherche {MODELS[model_code]}...")

              try:
                  response = curl_requests.get(
                      API_URL,
                      params={
                          "query": json.dumps(
                              query,
                              separators=(",", ":")
                          )
                      },
                      headers=headers,
                      impersonate="chrome",
                      timeout=30,
                  )

              except Exception as e:
                  print(f"❌ Erreur réseau : {e}")
                  return []

              print(f"   HTTP {response.status_code}")

              if response.status_code != 200:
                  print("   ⚠️ Réponse Tesla :")
                  print(response.text[:1000])
                  return []

              try:
                  data = response.json()
              except Exception:
                  print("❌ Tesla n'a pas retourné du JSON")
                  print(response.text[:1000])
                  return []

              results = data.get("results", [])

              if not isinstance(results, list):
                  print("⚠️ Format Tesla inattendu")
                  return []

              print(f"   ✅ {len(results)} véhicule(s)")

              return results

          def main():

              print("")
              print("🤖 TESLA HUNTER FRANCE")
              print("=" * 45)

              found = []

              for model_code in MODELS:

                  results = search_inventory(model_code)

                  for car in results:

                      condition = str(
                          car.get("Condition", "")
                      ).lower()

                      # On garde uniquement le neuf
                      if condition not in ("", "new"):
                          continue

                      found.append({
                          "model": MODELS[model_code],
                          "vin": car.get("VIN", ""),
                          "price": car.get("InventoryPrice"),
                          "trim": car.get(
                              "TrimName",
                              "Version inconnue"
                          ),
                          "year": car.get("Year", ""),
                          "paint": car.get("Paint", ""),
                          "interior": car.get("Interior", ""),
                          "location": car.get(
                              "DeliveryLocation",
                              ""
                          ),
                      })

              print("")
              print("=" * 45)
              print(f"🚗 TOTAL : {len(found)} Tesla neuve(s)")
              print("=" * 45)

              # -------------------------------------------------
              # AUCUNE TESLA
              # -------------------------------------------------

              if not found:
                  print("ℹ️ Aucune Tesla neuve détectée.")
                  return

              # -------------------------------------------------
              # CONSTRUCTION MESSAGE TELEGRAM
              # -------------------------------------------------

              message = (
                  "🚨 TESLA DISPONIBLE ! 🇫🇷\n\n"
                  f"🚗 {len(found)} Tesla neuve(s) détectée(s)\n\n"
              )

              for car in found[:15]:

                  price = car["price"]

                  if isinstance(price, (int, float)):
                      price_text = (
                          f"{price:,.0f} €"
                          .replace(",", " ")
                      )
                  else:
                      price_text = "Prix indisponible"

                  message += (
                      f"⚡ {car['model']}\n"
                      f"💰 {price_text}\n"
                      f"🏷️ {car['trim']}\n"
                  )

                  if car["year"]:
                      message += f"📅 {car['year']}\n"

                  if car["paint"]:
                      message += f"🎨 {car['paint']}\n"

                  if car["interior"]:
                      message += f"🛋️ {car['interior']}\n"

                  if car["location"]:
                      message += f"📍 {car['location']}\n"

                  if car["vin"]:
                      message += f"🔑 VIN : {car['vin']}\n"

                  message += "\n"

              # -------------------------------------------------
              # TELEGRAM
              # -------------------------------------------------

              send_telegram(message)

              print("✅ Alerte Telegram envoyée !")

          main()
          PY