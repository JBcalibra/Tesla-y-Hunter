name: Tesla Hunter France

on:
  schedule:
    - cron: "*/10 * * * *"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  tesla-hunter:
    runs-on: ubuntu-latest

    steps:
      - name: Récupérer le dépôt
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Installer Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Installer les dépendances
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: Rechercher les Tesla neuves
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}

        run: |
          python - <<'PY'

          import os
          import json
          import hashlib
          import subprocess
          import requests


          # ============================================================
          # CONFIGURATION
          # ============================================================

          INVENTORY_URL = "https://www.tesla.com/inventory/api/v4/inventory-results"

          COUNTRY = "FR"

          MODELS = {
              "Model 3",
              "Model Y",
              "Model S",
              "Model X",
          }

          STATE_FILE = "tesla_seen.json"

          BOT_TOKEN = os.environ["TELEGRAM_BOT_TOKEN"]
          CHAT_ID = os.environ["TELEGRAM_CHAT_ID"]


          # ============================================================
          # TELEGRAM
          # ============================================================

          def send_telegram(text):

              url = f"https://api.telegram.org/bot{BOT_TOKEN}/sendMessage"

              response = requests.post(
                  url,
                  json={
                      "chat_id": CHAT_ID,
                      "text": text,
                      "disable_web_page_preview": False,
                  },
                  timeout=20,
              )

              print("Telegram HTTP:", response.status_code)

              if response.status_code != 200:
                  print(response.text)
                  raise RuntimeError("Erreur Telegram")


          # ============================================================
          # ETAT
          # ============================================================

          def load_seen():

              if not os.path.exists(STATE_FILE):
                  return set()

              try:

                  with open(
                      STATE_FILE,
                      "r",
                      encoding="utf-8"
                  ) as f:

                      return set(json.load(f))

              except Exception as e:

                  print("⚠️ Impossible de lire l'état :", e)

                  return set()


          def save_seen(seen):

              with open(
                  STATE_FILE,
                  "w",
                  encoding="utf-8"
              ) as f:

                  json.dump(
                      sorted(seen),
                      f,
                      ensure_ascii=False,
                      indent=2,
                  )


          # ============================================================
          # NORMALISATION MODELE
          # ============================================================

          def normalize_model(vehicle):

              text = " ".join(
                  str(vehicle.get(key, ""))
                  for key in [
                      "Model",
                      "model",
                      "modelName",
                      "model_name",
                      "trim",
                      "Trim",
                  ]
              ).lower()


              if "model 3" in text:
                  return "Model 3"

              if "model y" in text:
                  return "Model Y"

              if "model s" in text:
                  return "Model S"

              if "model x" in text:
                  return "Model X"

              return None


          # ============================================================
          # EXTRACTION PRIX
          # ============================================================

          def extract_price(vehicle):

              possible_keys = [
                  "Price",
                  "price",
                  "totalPrice",
                  "total_price",
                  "cashPrice",
                  "cash_price",
              ]

              for key in possible_keys:

                  value = vehicle.get(key)

                  if value is not None:

                      try:

                          number = float(value)

                          return (
                              f"{number:,.0f}"
                              .replace(",", " ")
                              + " €"
                          )

                      except Exception:
                          pass

              return ""


          # ============================================================
          # IDENTIFIANT
          # ============================================================
          #
          # PAS DE VIN.
          #
          # On construit une signature à partir des caractéristiques
          # disponibles de la voiture.
          #
          # L'objectif est simplement :
          #
          #   même configuration = même véhicule logique
          #
          # et non d'identifier juridiquement la voiture.
          # ============================================================

          def vehicle_id(vehicle, model):

              interesting_keys = [
                  "Model",
                  "model",
                  "modelName",
                  "Trim",
                  "trim",
                  "Price",
                  "price",
                  "ExteriorColor",
                  "exteriorColor",
                  "interiorColor",
                  "InteriorColor",
                  "wheel",
                  "Wheels",
                  "wheelConfig",
                  "battery",
                  "Battery",
                  "drive",
                  "Drive",
                  "configuration",
              ]

              data = {}

              for key in interesting_keys:

                  if key in vehicle:
                      data[key] = vehicle[key]

              data["model_normalized"] = model

              raw = json.dumps(
                  data,
                  sort_keys=True,
                  ensure_ascii=False,
                  default=str,
              )

              return hashlib.sha256(
                  raw.encode("utf-8")
              ).hexdigest()


          # ============================================================
          # RECHERCHE INVENTAIRE
          # ============================================================

          print("=" * 60)
          print("TESLA HUNTER FRANCE")
          print("=" * 60)

          print()
          print("Source :", INVENTORY_URL)
          print("Pays   :", COUNTRY)
          print("Modèles:", ", ".join(sorted(MODELS)))
          print()


          headers = {
              "User-Agent": (
                  "Mozilla/5.0 "
                  "(X11; Linux x86_64) "
                  "AppleWebKit/537.36 "
                  "(KHTML, like Gecko) "
                  "Chrome/139.0.0.0 Safari/537.36"
              ),
              "Accept": "application/json",
              "Accept-Language": "fr-FR,fr;q=0.9,en;q=0.8",
          }


          # ============================================================
          # PARAMETRES INVENTAIRE
          # ============================================================
          #
          # On demande uniquement des véhicules disponibles en France.
          #
          # L'API Tesla peut faire évoluer ses paramètres.
          # Si Tesla modifie son schéma, le workflow affichera le JSON
          # reçu afin de faciliter la maintenance.
          # ============================================================

          params = {
              "country": COUNTRY,
              "condition": "new",
              "model": "m3,my,ms,mx",
          }


          try:

              response = requests.get(
                  INVENTORY_URL,
                  params=params,
                  headers=headers,
                  timeout=30,
              )

          except Exception as e:

              print("❌ Impossible de contacter Tesla.")
              print(e)

              raise SystemExit(1)


          print("HTTP Tesla :", response.status_code)
          print("URL finale :", response.url)


          # ============================================================
          # 403
          # ============================================================

          if response.status_code == 403:

              print()
              print("❌ TESLA A REFUSÉ LA REQUÊTE (HTTP 403)")
              print()
              print(
                  "Ce n'est PAS interprété comme "
                  "'aucune voiture disponible'."
              )
              print(
                  "L'état précédent est donc conservé."
              )

              raise SystemExit(1)


          if response.status_code != 200:

              print()
              print(
                  "❌ Réponse Tesla inattendue :",
                  response.status_code,
              )

              print(response.text[:2000])

              raise SystemExit(1)


          # ============================================================
          # JSON
          # ============================================================

          try:

              data = response.json()

          except Exception as e:

              print("❌ Réponse Tesla non JSON.")
              print(e)
              print(response.text[:2000])

              raise SystemExit(1)


          print()
          print("JSON Tesla reçu.")
          print()


          # ============================================================
          # EXTRACTION DES VEHICULES
          # ============================================================

          vehicles_raw = []


          if isinstance(data, list):

              vehicles_raw = data


          elif isinstance(data, dict):

              # Plusieurs structures possibles.

              for key in [
                  "results",
                  "vehicles",
                  "inventory",
                  "data",
                  "resultsData",
              ]:

                  value = data.get(key)

                  if isinstance(value, list):

                      vehicles_raw = value
                      break


                  if isinstance(value, dict):

                      for subkey in [
                          "results",
                          "vehicles",
                          "inventory",
                      ]:

                          subvalue = value.get(subkey)

                          if isinstance(subvalue, list):

                              vehicles_raw = subvalue
                              break

                      if vehicles_raw:
                          break


          print(
              "Objets véhicules reçus :",
              len(vehicles_raw)
          )


          # ============================================================
          # NORMALISATION
          # ============================================================

          vehicles = []


          for raw_vehicle in vehicles_raw:

              if not isinstance(raw_vehicle, dict):
                  continue


              model = normalize_model(raw_vehicle)


              if model not in MODELS:
                  continue


              vehicle = {
                  "id": vehicle_id(
                      raw_vehicle,
                      model
                  ),
                  "model": model,
                  "price": extract_price(raw_vehicle),
                  "raw": raw_vehicle,
              }


              vehicles.append(vehicle)


          # ============================================================
          # DOUBLONS
          # ============================================================

          unique = {}

          for vehicle in vehicles:

              unique[vehicle["id"]] = vehicle


          vehicles = list(unique.values())


          print()
          print(
              "Tesla neuves détectées :",
              len(vehicles)
          )


          for vehicle in vehicles:

              print(
                  "-",
                  vehicle["model"],
                  vehicle["price"],
                  vehicle["id"][:12]
              )


          # ============================================================
          # ETAT
          # ============================================================

          seen = load_seen()

          print()
          print(
              "Configurations déjà vues :",
              len(seen)
          )


          new_vehicles = [
              vehicle
              for vehicle in vehicles
              if vehicle["id"] not in seen
          ]


          # ============================================================
          # PREMIERE EXECUTION
          # ============================================================

          if not seen:

              print()
              print("ℹ️ Première exécution.")
              print(
                  "Les disponibilités actuelles "
                  "sont mémorisées."
              )

              for vehicle in vehicles:
                  seen.add(vehicle["id"])

              save_seen(seen)


          else:

              print()
              print(
                  "🆕 Nouvelles disponibilités :",
                  len(new_vehicles)
              )


              # ========================================================
              # TELEGRAM
              # ========================================================

              for vehicle in new_vehicles:

                  message = (
                      "🚨 TESLA DISPONIBLE 🇫🇷\n\n"
                      f"🚗 {vehicle['model']}\n"
                  )


                  if vehicle["price"]:

                      message += (
                          f"💰 {vehicle['price']}\n"
                      )


                  message += (
                      "\n🔗 "
                      "https://www.tesla.com/fr_fr/inventory"
                  )


                  print()
                  print("-" * 60)
                  print(message)
                  print("-" * 60)


                  send_telegram(message)

                  seen.add(vehicle["id"])


              save_seen(seen)


          # ============================================================
          # SAUVEGARDE GITHUB
          # ============================================================

          subprocess.run(
              [
                  "git",
                  "config",
                  "user.name",
                  "Tesla Hunter",
              ],
              check=True,
          )


          subprocess.run(
              [
                  "git",
                  "config",
                  "user.email",
                  "tesla-hunter@users.noreply.github.com",
              ],
              check=True,
          )


          subprocess.run(
              [
                  "git",
                  "add",
                  STATE_FILE,
              ],
              check=True,
          )


          result = subprocess.run(
              [
                  "git",
                  "diff",
                  "--cached",
                  "--quiet",
              ]
          )


          if result.returncode != 0:

              subprocess.run(
                  [
                      "git",
                      "commit",
                      "-m",
                      "Update Tesla Hunter state",
                  ],
                  check=True,
              )


              subprocess.run(
                  [
                      "git",
                      "push",
                  ],
                  check=True,
              )


              print()
              print(
                  "✅ Etat sauvegardé dans GitHub."
              )


          else:

              print()
              print(
                  "ℹ️ Aucun changement à sauvegarder."
              )


          print()
          print("=" * 60)
          print("✅ TESLA HUNTER TERMINÉ")
          print("=" * 60)

          PY
